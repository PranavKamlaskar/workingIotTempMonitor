<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP8266 Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    h1 {
      color: #333;
    }
    .reading {
      font-size: 1.2em;
      margin-bottom: 10px;
    }
    #historyChart {
      max-width: 800px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>Temperature & Humidity</h1>
  <div class="reading">Temperature: <span id="temp">--</span> °C</div>
  <div class="reading">Humidity: <span id="hum">--</span> %</div>
  <div class="reading">Time: <span id="timestamp">--</span></div>

  <h3>Temperature & Humidity History (Past 50)</h3>
  <canvas id="historyChart" width="400" height="200"></canvas>

  <script>
    async function updateData() {
      const res = await fetch("/api/latest");
      const data = await res.json();
      document.getElementById("temp").innerText = data.temperature;
      document.getElementById("hum").innerText = data.humidity;
      document.getElementById("timestamp").innerText = data.timestamp;
    }

    async function loadChartData() {
      const res = await fetch("/api/history?limit=50");
      const data = await res.json();

      const labels = data.map(d => new Date(d.timestamp).toLocaleTimeString());
      const temps = data.map(d => d.temperature);
      const hums = data.map(d => d.humidity);

      const ctx = document.getElementById('historyChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Temperature (°C)',
              data: temps,
              borderColor: 'red',
              fill: false
            },
            {
              label: 'Humidity (%)',
              data: hums,
              borderColor: 'blue',
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: false
            }
          }
        }
      });
    }

    updateData();
    setInterval(updateData, 5000); // Refresh values every 5s
    loadChartData(); // Load graph once on page load
  </script>
</body>
</html>
